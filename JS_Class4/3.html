<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-RemoveAll</title>
</head>

<body>
    <button id="removeAll">Remove All</button>

    <ul>
        <li>
            <p>Task - 1</p>
            <button class="delete_button">1st Delete</button>
        </li>
        <li>
            <p>Task - 2</p>
            <button class="delete_button">2nd Delete</button>
        </li>
        <li>
            <p>Task - 3</p>
            <button class="delete_button">3rd Delete</button>
        </li>
        <li>
            <p>Task - 4</p>
            <button class="delete_button">4th Delete</button>
        </li>
    </ul>

    

    <script>
        
        // Q- Make remove all button work  and make individual delete btn work
        //1.remove All btn should delete all task
        let ourList = document.querySelector('ul')
        let AlllistItems = ourList.querySelectorAll('li')


        let AllDeleteButtons = document.querySelectorAll('.delete_button')
        let removeButton = document.querySelector('#removeAll')

        //Remove specific Tasks
        for(let i = 0; i < AllDeleteButtons.length; i++){
            AllDeleteButtons[i].addEventListener('click', function(e){
                e.currentTarget.parentElement.remove()
            })
        }
        removeButton.addEventListener('click', function() {
            console.log('Button Clicked')
            AllListItems = ourList.querySelector('li')
            console.log(AllListItems)

            for(let i = 0; i <AlllistItems.length; i++){
                ourList.removeChild(AlllistItems[i])
            }
        })

    </script>

</body>

</html>
